# Deploy stack shared by both Dokploy services (production and test). Fork-owned:
# upstream has no .custom/ directory, so this file never conflicts on sync.
#
# Dokploy runs each service as:
#   docker compose -p <appName> --env-file .custom/.env -f <this file> up -d --build
# so the project name, and with it the volume and network names, differ per
# service. Do not add a top-level `name:` - it would compete with `-p`.
# Secrets, PUBLIC_BASE_URL and IMAGE_TAG come from each service's Dokploy env.
# In-network DB/Redis targets are opinionated here so they do not inherit
# host-dev localhost values. Postgres/Redis stay off the host network.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trueforge}
      POSTGRES_USER: ${POSTGRES_USER:-trueforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - trueforge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - trueforge

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - trueforge

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    # Per environment, so a test build can not silently replace the prod image.
    image: truefoundry-server:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8790
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trueforge}
      POSTGRES_USER: ${POSTGRES_USER:-trueforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      STANDALONE: "false"
      REDIS_URL: redis://redis:6379
      TRUEFORGE_API_KEY: ${TRUEFORGE_API_KEY:?TRUEFORGE_API_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8790"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - trueforge

  controller:
    build:
      context: ..
      dockerfile: Dockerfile
    image: truefoundry-server:${IMAGE_TAG:-latest}
    # From-source image WORKDIR is /app/packages/trueforge; the npm-install
    # layout (node_modules/@truefoundry/trueforge) only exists in Dockerfile.npm.
    command: ["node", "dist/controller-main.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      STANDALONE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trueforge}
      POSTGRES_USER: ${POSTGRES_USER:-trueforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SERVER_URL: http://server:8790
      TRUEFORGE_API_KEY: ${TRUEFORGE_API_KEY:?TRUEFORGE_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - trueforge

volumes:
  trueforge_postgres:

networks:
  trueforge:
    driver: bridge
